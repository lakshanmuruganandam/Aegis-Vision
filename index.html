<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aegis Vision | YOLOv8 Spatial Object Tracking Core</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap');
        
        :root {
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.5);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
        }

        body { 
            background-color: #fafafa; 
            color: #0f172a; 
            font-family: 'Outfit', sans-serif; 
            min-height: 100vh;
            overflow: hidden; 
            margin: 0; padding: 0; 
        }
        
        /* Ultra-Realistic Aurora + Noise Background */
        .ambient-bg {
            position: fixed; inset: 0; z-index: 0;
            background: radial-gradient(circle at 10% 20%, rgba(209, 250, 229, 1), transparent 40%),
                        radial-gradient(circle at 90% 80%, rgba(224, 242, 254, 1), transparent 40%),
                        radial-gradient(circle at 50% 50%, rgba(248, 250, 252, 1), transparent 50%);
            background-color: #fafafa;
        }
        
        .noise-overlay {
            position: fixed; inset: 0; z-index: 1;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
        }

        .aurora-orb {
            position: absolute; border-radius: 50%; filter: blur(80px);
            animation: float 20s infinite ease-in-out alternate;
            mix-blend-mode: multiply; opacity: 0.6;
        }
        .orb-1 { width: 60vw; height: 60vw; background: rgba(52, 211, 153, 0.15); top: -20%; left: -10%; animation-duration: 25s; }
        .orb-2 { width: 50vw; height: 50vw; background: rgba(56, 189, 248, 0.12); bottom: -10%; right: -10%; animation-duration: 30s; animation-delay: -5s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(3%, 5%) scale(1.05); }
        }
        
        /* Premium VisionOS Glassmorphism */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid var(--glass-border);
            box-shadow: 
                var(--glass-shadow),
                inset 0 1px 0 rgba(255, 255, 255, 0.8),
                inset 0 -1px 0 rgba(255, 255, 255, 0.2);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .text-gradient {
            background-clip: text; -webkit-background-clip: text; color: transparent;
            background-image: linear-gradient(135deg, #0f172a 0%, #475569 100%);
        }

        /* Camera Viewport */
        .camera-wrapper {
            position: relative; overflow: hidden;
            border-radius: 32px; background: #000;
            box-shadow: 0 0 0 1px rgba(255,255,255,0.2), 0 20px 40px -10px rgba(0,0,0,0.2);
            isolation: isolate;
        }
        video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;
            transform: scaleX(-1);
        }

        /* High-End Tracking Boxes */
        .tracking-box {
            position: absolute;
            border: 2px solid #10b981;
            border-radius: 12px;
            background: radial-gradient(circle at center, transparent 30%, rgba(16, 185, 129, 0.15) 100%);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.3), inset 0 0 15px rgba(16, 185, 129, 0.2);
            pointer-events: none;
            transition: all 0.1s linear;
        }
        
        .tracking-box::before, .tracking-box::after {
            content: ''; position: absolute; width: 10px; height: 10px; border-color: #10b981; border-style: solid;
        }
        .tracking-box::before { top: -2px; left: -2px; border-width: 2px 0 0 2px; border-top-left-radius: 10px; }
        .tracking-box::after { bottom: -2px; right: -2px; border-width: 0 2px 2px 0; border-bottom-right-radius: 10px; }

        .tracking-label {
            position: absolute; top: -35px; left: 50%; transform: translateX(-50%);
            padding: 4px 12px;
            font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 700;
            color: #fff; letter-spacing: 0.5px; text-transform: uppercase;
            border-radius: 8px; background: rgba(16, 185, 129, 0.85);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); backdrop-filter: blur(10px);
            white-space: nowrap;
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* Buttons */
        .btn-holo {
            background: rgba(255,255,255,0.7); color: #0f172a;
            font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 700;
            border-radius: 20px; border: 1px solid rgba(255,255,255,0.9); cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05), inset 0 2px 4px rgba(255,255,255,1);
            backdrop-filter: blur(10px);
            display: flex; flex-direction: column; items-center; justify-center; gap: 8px;
        }
        .btn-holo:hover {
            transform: translateY(-4px) scale(1.02); background: #0f172a; color: white;
            box-shadow: 0 15px 30px rgba(15, 23, 42, 0.25);
            border-color: #0f172a;
        }
        .btn-holo:hover svg { color: #34d399; }
        
        .pulse-dot {
            animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* Terminal Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.3); border-radius: 10px; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 md:p-8 relative">
    <div class="ambient-bg"></div>
    <div class="noise-overlay"></div>
    <div class="aurora-orb orb-1"></div>
    <div class="aurora-orb orb-2"></div>

    <div class="z-10 w-full max-w-[1500px] grid grid-cols-1 lg:grid-cols-[1fr_420px] gap-6 md:gap-8 h-[90vh] min-h-[750px]">
        <!-- Video Stream Panel -->
        <div class="glass-panel rounded-[32px] md:rounded-[48px] p-6 md:p-8 flex flex-col relative">
            <div class="flex items-center justify-between mb-6">
                <div class="flex items-center gap-5">
                    <div class="w-16 h-16 rounded-[20px] bg-white border border-slate-100 flex items-center justify-center shadow-sm">
                        <svg class="w-8 h-8 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight text-gradient mb-1">Aegis Vision</h1>
                        <p class="text-[11px] text-slate-400 font-bold tracking-[0.25em] uppercase">YOLOv8 Spatial Tracking</p>
                    </div>
                </div>

                <div class="flex items-center gap-3 bg-white/50 backdrop-blur-md px-4 py-2 rounded-full border border-white shadow-sm">
                    <div class="text-[10px] font-extrabold text-slate-500 tracking-widest uppercase" id="status-text">Standby</div>
                    <div class="w-2.5 h-2.5 rounded-full bg-slate-300 transition-colors duration-500" id="indicator-status"></div>
                </div>
            </div>

            <!-- Video Window -->
            <div class="camera-wrapper flex-grow w-full">
                <!-- Init Screen -->
                <div id="initOverlay" class="absolute inset-0 bg-white/60 backdrop-blur-xl flex flex-col items-center justify-center z-30 transition-all duration-700">
                    <div class="text-[80px] font-black text-white drop-shadow-[0_4px_20px_rgba(0,0,0,0.05)] mb-10 select-none tracking-widest">AEGIS</div>
                    <div class="flex gap-6">
                        <button id="btnStart" class="btn-holo w-36 h-36 flex items-center justify-center" onclick="startCamera()">
                            <svg class="w-8 h-8 text-slate-400 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                            Live Camera
                        </button>
                        <button id="btnUploadVideo" class="btn-holo w-36 h-36 flex items-center justify-center" onclick="document.getElementById('fileUpload').click()">
                            <svg class="w-8 h-8 text-slate-400 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z"></path></svg>
                            Upload Video
                        </button>
                        <button id="btnUploadImage" class="btn-holo w-36 h-36 flex items-center justify-center" onclick="document.getElementById('imageUpload').click()">
                            <svg class="w-8 h-8 text-slate-400 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                            Upload Image
                        </button>
                    </div>
                    <input type="file" id="fileUpload" accept="video/*" class="hidden" />
                    <input type="file" id="imageUpload" accept="image/*" class="hidden" />
                </div>

                <video id="videoFeed" autoplay playsinline class="hidden"></video>
                <img id="imageFeed" class="hidden absolute top-0 left-0 w-full h-full object-contain bg-black/90" />
                <div id="hudContainer" class="absolute top-0 left-0 w-full h-full pointer-events-none z-10"></div>
                
                <button id="btnStop" class="hidden absolute top-6 right-6 z-40 bg-white/20 text-white px-6 py-3 rounded-full font-bold text-xs shadow-xl border border-white/40 backdrop-blur-md tracking-widest uppercase transition hover:bg-red-500 hover:border-red-500 flex items-center gap-2" onclick="stopCamera()">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    Terminate
                </button>
            </div>
        </div>

        <!-- Telemetry Panel -->
        <div class="glass-panel rounded-[32px] md:rounded-[48px] p-8 flex flex-col">
            <div class="flex items-center justify-between mb-8">
                <h2 class="text-slate-800 font-extrabold text-sm tracking-[0.2em] uppercase">Telemetry</h2>
                <div class="w-8 h-8 rounded-full bg-white border border-slate-100 flex items-center justify-center shadow-sm">
                    <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                </div>
            </div>

            <div class="space-y-6 flex-grow flex flex-col">
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-white/50 backdrop-blur-sm rounded-[24px] p-6 border border-white shadow-sm flex flex-col justify-center transition hover:shadow-md hover:bg-white/70">
                        <div class="text-[10px] font-bold tracking-wider text-slate-400 mb-2 uppercase">Latency / FPS</div>
                        <div id="stat-latency" class="text-3xl font-extrabold text-slate-800 tracking-tighter">--<span class="text-sm text-slate-400 ml-1 font-normal">ms</span></div>
                    </div>
                    <div class="bg-white/50 backdrop-blur-sm rounded-[24px] p-6 border border-white shadow-sm flex flex-col justify-center transition hover:shadow-md hover:bg-white/70">
                        <div class="text-[10px] font-bold tracking-wider text-slate-400 mb-2 uppercase">Entities</div>
                        <div id="stat-count" class="text-4xl font-extrabold text-emerald-500 tracking-tighter drop-shadow-sm">0</div>
                    </div>
                </div>

                <div class="bg-white/50 backdrop-blur-sm rounded-[24px] p-6 border border-white shadow-sm">
                    <div class="flex justify-between items-center mb-4">
                        <span class="text-[11px] font-bold tracking-wider text-slate-500 uppercase">Neural Engine</span>
                        <span class="text-[10px] font-bold text-emerald-600 bg-emerald-50 px-3 py-1.5 rounded-md border border-emerald-100 shadow-[inset_0_1px_2px_rgba(255,255,255,1)]">YOLOv8 + DeepSORT</span>
                    </div>
                    <div class="w-full h-2 bg-slate-200/50 rounded-full overflow-hidden shadow-inner">
                        <div class="h-full bg-gradient-to-r from-emerald-400 to-emerald-500 w-full animate-pulse"></div>
                    </div>
                </div>

                <!-- Terminal -->
                <div class="bg-slate-900 rounded-[24px] p-5 border border-slate-800 flex-grow overflow-y-auto font-mono text-[11px] leading-relaxed relative shadow-[inset_0_2px_10px_rgba(0,0,0,0.5)]">
                    <div id="sys-log" class="space-y-2 text-emerald-400/80">
                        <div><span class="text-emerald-500 font-bold mr-2">&gt;</span>Aegis Vision Subsystem Initialized.</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('videoFeed');
        const imageFeed = document.getElementById('imageFeed');
        const hudContainer = document.getElementById('hudContainer');
        const btnStop = document.getElementById('btnStop');
        const initOverlay = document.getElementById('initOverlay');
        const indicatorStatus = document.getElementById('indicator-status');
        const statusText = document.getElementById('status-text');
        const sysLog = document.getElementById('sys-log');
        const statLatency = document.getElementById('stat-latency');
        const statCount = document.getElementById('stat-count');
        
        let stream = null;
        let isRunning = false;
        let activeSource = 'live';
        let currentBoxes = {};
        
        const captureCanvas = document.createElement('canvas');
        const cCtx = captureCanvas.getContext('2d');

        function logEvent(msg, type='info') {
            const div = document.createElement('div');
            let color = 'text-emerald-400';
            if(type==='warn') color = 'text-amber-400';
            if(type==='error') color = 'text-pink-400';
            div.innerHTML = `<span class="${color} font-bold mr-2">&gt;</span> <span class="text-slate-300">${msg}</span>`;
            sysLog.appendChild(div);
            sysLog.parentElement.scrollTop = sysLog.parentElement.scrollHeight;
        }

        async function startCamera() {
            try {
                if(stream) stream.getTracks().forEach(t => t.stop());
                imageFeed.classList.add('hidden');
                
                stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720, facingMode: "user" } });
                video.srcObject = stream;
                video.classList.remove('hidden');
                
                initOverlay.classList.add('hidden');
                btnStop.classList.remove('hidden');
                
                indicatorStatus.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 pulse-dot";
                statusText.textContent = "LIVE STREAM";
                statusText.className = "text-[10px] font-extrabold text-emerald-600 tracking-widest uppercase";
                
                activeSource = 'live';
                logEvent("Camera optical stream established.", "info");
                
                video.onloadedmetadata = () => {
                    captureCanvas.width = video.videoWidth;
                    captureCanvas.height = video.videoHeight;
                    isRunning = true;
                    processFrame();
                };
            } catch(e) {
                logEvent("Camera error: " + e.message, "error");
            }
        }

        document.getElementById('imageUpload').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(!file) return;
            
            if(stream) stream.getTracks().forEach(t => t.stop());
            video.classList.add('hidden');
            
            imageFeed.src = URL.createObjectURL(file);
            imageFeed.classList.remove('hidden');
            initOverlay.classList.add('hidden');
            btnStop.classList.remove('hidden');
            
            activeSource = 'image';
            indicatorStatus.className = "w-2.5 h-2.5 rounded-full bg-amber-500";
            statusText.textContent = "STATIC IMAGE";
            statusText.className = "text-[10px] font-extrabold text-amber-600 tracking-widest uppercase";
            logEvent("Static image asset loaded into tensor.", "warn");
            
            imageFeed.onload = async () => {
                captureCanvas.width = imageFeed.naturalWidth;
                captureCanvas.height = imageFeed.naturalHeight;
                cCtx.drawImage(imageFeed, 0, 0, captureCanvas.width, captureCanvas.height);
                const dataUrl = captureCanvas.toDataURL('image/jpeg', 0.8);
                
                try {
                    const res = await fetch('/api/detect', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ image_base64: dataUrl })
                    });
                    const data = await res.json();
                    if(data.status === 'success') {
                        updateHUD(data.objects);
                        statCount.textContent = data.telemetry.objects_found;
                        statLatency.innerHTML = `${data.telemetry.execution_ms}<span class="text-xs text-slate-400 font-normal ml-1">ms</span>`;
                        logEvent(`Detected ${data.telemetry.objects_found} entities in ${data.telemetry.execution_ms}ms`, "info");
                    }
                } catch(err) {
                    logEvent("Detection failed: API Error", "error");
                }
            };
        });

        document.getElementById('fileUpload').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(!file) return;
            
            if(stream) stream.getTracks().forEach(t => t.stop());
            imageFeed.classList.add('hidden');
            
            video.src = URL.createObjectURL(file);
            video.loop = true; video.muted = true;
            // reset transform for video file (no mirror)
            video.style.transform = 'scaleX(1)';
            video.classList.remove('hidden');
            initOverlay.classList.add('hidden');
            btnStop.classList.remove('hidden');
            
            activeSource = 'video';
            indicatorStatus.className = "w-2.5 h-2.5 rounded-full bg-sky-500 pulse-dot";
            statusText.textContent = "VIDEO FEED";
            statusText.className = "text-[10px] font-extrabold text-sky-600 tracking-widest uppercase";
            logEvent("Video file stream loaded.", "warn");
            
            video.onloadeddata = () => {
                captureCanvas.width = video.videoWidth;
                captureCanvas.height = video.videoHeight;
                video.play();
                isRunning = true;
                processFrame();
            };
        });

        function stopCamera() {
            if(stream) stream.getTracks().forEach(t => t.stop());
            video.pause(); isRunning = false;
            video.style.transform = 'scaleX(-1)'; // reset default mirror
            
            initOverlay.classList.remove('hidden');
            btnStop.classList.add('hidden');
            hudContainer.innerHTML = '';
            currentBoxes = {};
            
            indicatorStatus.className = "w-2.5 h-2.5 rounded-full bg-slate-300";
            statusText.textContent = "STANDBY";
            statusText.className = "text-[10px] font-extrabold text-slate-500 tracking-widest uppercase";
            
            statCount.textContent = '0';
            statLatency.innerHTML = `--<span class="text-sm text-slate-400 ml-1 font-normal">ms</span>`;
            
            logEvent("Optical sensor offline.", "error");
        }

        function updateHUD(objects) {
            const seenIds = new Set();
            
            let clientWidth, clientHeight, sourceWidth, sourceHeight;
            
            if (activeSource === 'image') {
                // For object-fit: contain, we need to calculate the actual rendered dimensions
                const ratio = Math.min(imageFeed.clientWidth / imageFeed.naturalWidth, imageFeed.clientHeight / imageFeed.naturalHeight);
                clientWidth = imageFeed.naturalWidth * ratio;
                clientHeight = imageFeed.naturalHeight * ratio;
                sourceWidth = imageFeed.naturalWidth;
                sourceHeight = imageFeed.naturalHeight;
            } else {
                // Video covers the area via object-fit: cover
                clientWidth = video.clientWidth;
                clientHeight = video.clientHeight;
                sourceWidth = video.videoWidth;
                sourceHeight = video.videoHeight;
            }
            
            // Offset for object-fit contain centering
            let offsetX = 0, offsetY = 0;
            if(activeSource === 'image') {
                offsetX = (imageFeed.clientWidth - clientWidth) / 2;
                offsetY = (imageFeed.clientHeight - clientHeight) / 2;
            }
            
            const scaleX = clientWidth / sourceWidth;
            const scaleY = clientHeight / sourceHeight;
            
            // For object-fit: cover, the video might be cropped. We need to handle this.
            // Simplified approach: assuming the wrapper aspect ratio is close to video aspect ratio
            
            objects.forEach((obj, idx) => {
                const id = `obj-${idx}`; // Ideally use real tracking ID from backend if available
                seenIds.add(id);
                
                const w = obj.width * scaleX;
                const h = obj.height * scaleY;
                
                let realX = obj.x * scaleX;
                // Handle mirroring for live camera
                if(activeSource === 'live') {
                    realX = clientWidth - (realX + w);
                }
                
                const realY = obj.y * scaleY;

                let box = currentBoxes[id];
                if(!box) {
                    box = document.createElement('div');
                    box.className = 'tracking-box';
                    box.id = id;
                    
                    const label = document.createElement('div');
                    label.className = 'tracking-label';
                    box.appendChild(label);
                    hudContainer.appendChild(box);
                    currentBoxes[id] = box;
                }
                
                box.style.left = `${realX + offsetX}px`; 
                box.style.top = `${realY + offsetY}px`;
                box.style.width = `${w}px`; 
                box.style.height = `${h}px`;
                
                const label = box.querySelector('.tracking-label');
                label.innerHTML = `<span class="opacity-70 mr-1">[${obj.id}]</span> ${obj.label} <span class="text-emerald-200 ml-1">${(obj.confidence*100).toFixed(0)}%</span>`;
            });
            
            Object.keys(currentBoxes).forEach(id => {
                if(!seenIds.has(id)) {
                    if(currentBoxes[id]) { currentBoxes[id].remove(); delete currentBoxes[id]; }
                }
            });
        }

        async function processFrame() {
            if(!isRunning) return;
            cCtx.drawImage(video, 0, 0, captureCanvas.width, captureCanvas.height);
            const dataUrl = captureCanvas.toDataURL('image/jpeg', 0.5); // lower quality for speed

            try {
                const res = await fetch('/api/detect', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ image_base64: dataUrl })
                });
                const data = await res.json();
                
                if(data.status === 'success') {
                    updateHUD(data.objects);
                    statCount.textContent = data.telemetry.objects_found;
                    statLatency.innerHTML = `${data.telemetry.execution_ms}<span class="text-[10px] text-slate-400 font-bold ml-1 tracking-wider uppercase">ms (${data.telemetry.fps} FPS)</span>`;
                }
            } catch(e) {
                // Silently fail to not spam logs
            }
            // Dynamic polling rate based on source
            const delay = activeSource === 'live' ? 100 : 150;
            setTimeout(processFrame, delay);
        }
    </script>
</body>
</html>
